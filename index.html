<script>
// ============================================================
// 棋语 — Web 版
// 从微信小游戏转换：所有 wx.* API → Web 标准 API
// ============================================================

// ── Shared Web Audio Context ──
var _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { _audioCtx = null; }
  }
  if (_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

// ── Toast ──
var _toastTimer = null;
function showToast(msg, dur) {
  dur = dur || 1500;
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.classList.remove('show'); }, dur);
}

// ── Modal ──
function showModal(title, content, onOk, onCancel) {
  if (confirm(title + '\n' + content)) { if (onOk) onOk(); }
  else { if (onCancel) onCancel(); }
}

// ── LocalStorage wrappers ──
function storageSet(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
function storageGet(k) { try { return localStorage.getItem(k); } catch(e){ return null; } }
function storageRemove(k) { try { localStorage.removeItem(k); } catch(e){} }

// ============================================================
// Module: utils/game-logic.js (zero changes)
// ============================================================
var SZ = 19;

function neighbors(x, y) {
  var r = [];
  if (x > 0)      r.push([x - 1, y]);
  if (x < SZ - 1) r.push([x + 1, y]);
  if (y > 0)      r.push([x, y - 1]);
  if (y < SZ - 1) r.push([x, y + 1]);
  return r;
}

function getGroup(x, y, map) {
  var k = x + ',' + y;
  if (!map.has(k)) return [];
  var target = map.get(k);
  var color = target && target.color ? target.color : target;
  var visited = {}, group = [], stack = [[x, y]];
  while (stack.length) {
    var p = stack.pop(), ck = p[0] + ',' + p[1];
    if (visited[ck]) continue;
    var val = map.get(ck);
    var cc = val && val.color ? val.color : val;
    if (cc !== color) continue;
    visited[ck] = true; group.push(p);
    var nbs = neighbors(p[0], p[1]);
    for (var i = 0; i < nbs.length; i++) {
      if (!visited[nbs[i][0] + ',' + nbs[i][1]]) stack.push(nbs[i]);
    }
  }
  return group;
}

function getLiberties(group, map) {
  var libs = {};
  for (var i = 0; i < group.length; i++) {
    var nbs = neighbors(group[i][0], group[i][1]);
    for (var j = 0; j < nbs.length; j++) {
      var nk = nbs[j][0] + ',' + nbs[j][1];
      if (!map.has(nk)) libs[nk] = true;
    }
  }
  return Object.keys(libs).length;
}

function isKo(x, y, stoneMap, koPoint) {
  if (koPoint && koPoint[0] === x && koPoint[1] === y) return true;
  return false;
}

function calcKoPoint(x, y, captured, stoneMap, moves) {
  if (!captured || captured.length !== 1) return null;
  var cap = captured[0];
  var nbs = neighbors(x, y);
  var adj = false;
  for (var i = 0; i < nbs.length; i++) {
    if (nbs[i][0] === cap[0] && nbs[i][1] === cap[1]) { adj = true; break; }
  }
  if (!adj) return null;
  var sg = getGroup(x, y, stoneMap);
  if (getLiberties(sg, stoneMap) !== 1) return null;
  return cap;
}

function placeStone(x, y, stoneMap, moves, currentIdx, koPoint) {
  var k = x + ',' + y;
  if (stoneMap.has(k) || x < 0 || x >= SZ || y < 0 || y >= SZ) {
    return { success: false, reason: 'occupied' };
  }
  if (isKo(x, y, stoneMap, koPoint)) {
    return { success: false, reason: 'ko' };
  }

  var color = moves.length % 2 === 0 ? 'B' : 'W';

  if (currentIdx < moves.length - 1) {
    moves.splice(currentIdx + 1);
    rebuildStones(stoneMap, moves, currentIdx);
  }

  var moveNum = moves.length + 1;
  moves.push({ x: x, y: y, color: color });
  stoneMap.set(k, { color: color, num: moveNum });

  var opp = color === 'B' ? 'W' : 'B';
  var captured = [];
  var nbs = neighbors(x, y);
  for (var i = 0; i < nbs.length; i++) {
    var nk = nbs[i][0] + ',' + nbs[i][1];
    if (stoneMap.has(nk) && stoneMap.get(nk).color === opp) {
      var g = getGroup(nbs[i][0], nbs[i][1], stoneMap);
      if (getLiberties(g, stoneMap) === 0) {
        for (var j = 0; j < g.length; j++) {
          stoneMap.delete(g[j][0] + ',' + g[j][1]);
          captured.push(g[j]);
        }
      }
    }
  }

  var sg = getGroup(x, y, stoneMap);
  if (getLiberties(sg, stoneMap) === 0) {
    stoneMap.delete(k);
    moves.pop();
    return { success: false, reason: 'suicide' };
  }

  var newKo = calcKoPoint(x, y, captured, stoneMap, moves);
  return { success: true, captured: captured, color: color, moveNum: moveNum, koPoint: newKo };
}

function passMove(stoneMap, moves, currentIdx, koPoint) {
  if (currentIdx < moves.length - 1) {
    moves.splice(currentIdx + 1);
  }
  var color = moves.length % 2 === 0 ? 'B' : 'W';
  moves.push({ x: -1, y: -1, color: color });
  return { success: true, color: color, koPoint: null };
}

function undoMove(stoneMap, moves, currentIdx) {
  if (!moves.length) return { success: false };
  var m = moves.pop();
  var newIdx = Math.min(currentIdx, moves.length - 1);
  if (m.x >= 0) stoneMap.delete(m.x + ',' + m.y);
  rebuildStones(stoneMap, moves, newIdx);
  return { success: true, newIdx: newIdx };
}

function rebuildStones(stoneMap, moves, toIdx) {
  stoneMap.clear();
  for (var i = 0; i <= toIdx; i++) {
    var m = moves[i];
    if (m && m.x >= 0) stoneMap.set(m.x + ',' + m.y, { color: m.color, num: i + 1 });
  }
}

function calculateScore(stoneMap) {
  var territory = {};
  var empty = [];
  for (var x = 0; x < SZ; x++) {
    for (var y = 0; y < SZ; y++) {
      if (!stoneMap.has(x + ',' + y)) {
        empty.push([x, y]);
        territory[x + ',' + y] = null;
      }
    }
  }
  var visited = {};
  for (var i = 0; i < empty.length; i++) {
    var k = empty[i][0] + ',' + empty[i][1];
    if (visited[k]) continue;
    var stack = [empty[i]];
    var region = [];
    var border = { B: false, W: false };
    while (stack.length) {
      var p = stack.pop(), pk = p[0] + ',' + p[1];
      if (visited[pk]) continue;
      visited[pk] = true;
      region.push(p);
      var nbs = neighbors(p[0], p[1]);
      for (var j = 0; j < nbs.length; j++) {
        var nk = nbs[j][0] + ',' + nbs[j][1];
        if (stoneMap.has(nk)) {
          border[stoneMap.get(nk).color] = true;
        } else if (!visited[nk]) {
          stack.push(nbs[j]);
        }
      }
    }
    var owner = 'neutral';
    if (border.B && !border.W) owner = 'B';
    else if (border.W && !border.B) owner = 'W';
    for (var r = 0; r < region.length; r++) {
      territory[region[r][0] + ',' + region[r][1]] = owner;
    }
  }
  var blackTerr = 0, whiteTerr = 0, blackStones = 0, whiteStones = 0;
  for (var kk in territory) {
    if (territory[kk] === 'B') blackTerr++;
    else if (territory[kk] === 'W') whiteTerr++;
  }
  stoneMap.forEach(function (s) {
    if (s.color === 'B') blackStones++;
    else whiteStones++;
  });
  var blackTotal = blackTerr + blackStones;
  var whiteTotal = whiteTerr + whiteStones + 7.5;
  var winner, diff;
  if (blackTotal > whiteTotal) { winner = 'B'; diff = blackTotal - whiteTotal; }
  else { winner = 'W'; diff = whiteTotal - blackTotal; }
  return {
    blackScore: blackTotal, whiteScore: whiteTotal,
    blackTerritory: blackTerr, whiteTerritory: whiteTerr,
    blackStones: blackStones, whiteStones: whiteStones,
    winner: winner, diff: Math.round(diff * 10) / 10
  };
}

function isDoublePass(moves) {
  if (moves.length < 2) return false;
  var last = moves[moves.length - 1];
  var prev = moves[moves.length - 2];
  return last.x < 0 && prev.x < 0;
}

// ============================================================
// Module: utils/sound.js (wx.createWebAudioContext → AudioContext)
// ============================================================
var sound_isAudioOpen = true;

function sound_noise(ctx, ms) {
  var sr = ctx.sampleRate || 44100;
  var len = Math.floor(sr * ms / 1000);
  var buf = ctx.createBuffer(1, len, sr);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function sound_tick(ctx, freq, q, vol, ms) {
  if (!ctx) return;
  try {
    var t = ctx.currentTime;
    var dur = ms / 1000;
    var src = ctx.createBufferSource();
    src.buffer = sound_noise(ctx, 1);
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = q;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + dur);
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * 0.3;
    var g2 = ctx.createGain();
    g2.gain.setValueAtTime(vol * 0.2, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + dur * 2);
    osc.connect(g2); g2.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur * 2);
  } catch(e){}
}

function playBlack() { if (sound_isAudioOpen) sound_tick(getAudioCtx(), 750, 10, 0.4, 85); }
function playWhite() { if (sound_isAudioOpen) sound_tick(getAudioCtx(), 1500, 8, 0.32, 55); }
function playCapture(){ if (sound_isAudioOpen) sound_tick(getAudioCtx(), 480, 6, 0.28, 110); }
function sound_toggleAudio() { sound_isAudioOpen = !sound_isAudioOpen; return sound_isAudioOpen; }

// ============================================================
// Module: utils/music.js (wx.createWebAudioContext → AudioContext)
// ============================================================
var music_SCALE = [294, 330, 392, 440, 523, 587, 659, 784, 880];
var music_BEAT = 440;
var music_MELODY = [
  [0,3],[2,2],[3,2],[4,2], [5,3],[4,1],[3,2],[2,2],
  [0,2],[2,2],[0,2],[2,3], [3,2],[4,2],[3,1],[2,1],[0,3],
  [5,2],[6,3],[5,2],[4,2], [3,3],[4,1],[3,1],[2,3],
  [0,3],[3,2],[4,2],[5,2], [6,3],[5,1],[4,2],[3,2],
  [2,2],[3,2],[2,2],[0,3], [3,2],[2,1],[0,1],[1,3],
  [0,4], [2,2],[3,2],[4,3], [3,1],[2,2],[0,3],
  [5,2],[4,2],[3,2],[2,2], [0,3],[2,1],[3,1],[5,3],
  [6,2],[5,2],[3,2],[4,3], [3,2],[2,1],[0,3], [0,5]
];
var music_playing = false;
var music_timer = null;
var music_noteIdx = 0;

function music_pluck(freq, durMs, vol, offset) {
  var ctx = getAudioCtx();
  if (!ctx) return;
  var t = ctx.currentTime + (offset || 0);
  var dur = durMs / 1000;
  var o1 = ctx.createOscillator(); o1.type = 'sine';
  var g1 = ctx.createGain();
  o1.frequency.value = freq;
  g1.gain.setValueAtTime(vol, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.9);
  o1.connect(g1); g1.connect(ctx.destination);
  o1.start(t); o1.stop(t + dur);
  var o2 = ctx.createOscillator(); o2.type = 'sine';
  var g2 = ctx.createGain();
  o2.frequency.value = freq * 2;
  g2.gain.setValueAtTime(vol * 0.3, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.5);
  o2.connect(g2); g2.connect(ctx.destination);
  o2.start(t); o2.stop(t + dur * 0.5);
  var o3 = ctx.createOscillator(); o3.type = 'sine';
  var g3 = ctx.createGain();
  o3.frequency.value = freq * 4;
  g3.gain.setValueAtTime(vol * 0.1, t);
  g3.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.3);
  o3.connect(g3); g3.connect(ctx.destination);
  o3.start(t); o3.stop(t + dur * 0.3);
}

function music_slide(fromFreq, toFreq, durMs, offset) {
  var ctx = getAudioCtx();
  if (!ctx) return;
  var t = ctx.currentTime + (offset || 0);
  var dur = durMs / 1000;
  var o = ctx.createOscillator(); o.type = 'sine';
  var g = ctx.createGain();
  o.frequency.setValueAtTime(fromFreq, t);
  o.frequency.linearRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.2);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur * 1.2);
}

function music_echo(freq, durMs, delayMs, offset) {
  var ctx = getAudioCtx();
  if (!ctx) return;
  var t = ctx.currentTime + (offset || 0) + delayMs / 1000;
  var dur = durMs / 1000 * 0.6;
  var o = ctx.createOscillator(); o.type = 'sine';
  var g = ctx.createGain();
  o.frequency.value = freq * 2;
  g.gain.setValueAtTime(0.02, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur);
}

function music_next() {
  if (!music_playing) return;
  var m = music_MELODY[music_noteIdx];
  var freq = music_SCALE[m[0]];
  var durMs = m[1] * music_BEAT;
  music_pluck(freq, durMs, 0.12, 0);
  if (m[1] >= 5) {
    music_slide(music_SCALE[Math.max(0, m[0] - 2)], freq, 80, 0);
  }
  if (music_noteIdx % 14 === 7) {
    music_pluck(freq * 0.5, durMs * 1.5, 0.04, 0.03);
  }
  if (music_noteIdx % 10 === 0) {
    music_echo(freq, durMs, 150, 0);
  }
  music_noteIdx = (music_noteIdx + 1) % music_MELODY.length;
  music_timer = setTimeout(music_next, durMs * 0.82);
}

function music_play() {
  if (music_playing) return;
  if (!getAudioCtx()) return;
  music_playing = true;
  music_noteIdx = 0;
  music_next();
}
function music_pause() {
  music_playing = false;
  if (music_timer) { clearTimeout(music_timer); music_timer = null; }
}
function music_toggle() { if (music_playing) music_pause(); else music_play(); return music_playing; }
function music_isPlaying() { return music_playing; }

  if (my >= h - 48 && my <= h - 8 && mx >= 46 && mx <= 78) { music_toggle(); return 'music'; }
  var btnW = w - 100, btnH = 56, btnX = 50, startY = 220, gap = 20;
  var labels = ['duiju', 'history', 'rank', 'forum'];

var splash_startTime = 0;

}

function splash_draw(ctx, w, h) {
  var elapsed = (Date.now() - splash_startTime) / 1000;
  var remaining = Math.max(0, 5 - Math.ceil(elapsed));
  ctx.fillStyle = '#f5f0e8';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.012)';
  for (var fi = 0; fi < splash_fibers.length; fi++) ctx.fillRect(0, splash_fibers[fi] * h, w, 1);
  var stones = [
    { c: '#222', x: 0.82, y: 0.18, s: 28, ph: 0 },
    { c: '#eee', x: 0.15, y: 0.13, s: 24, ph: 1.2 },
    { c: '#222', x: 0.12, y: 0.72, s: 26, ph: 2.4 },
    { c: '#eee', x: 0.80, y: 0.65, s: 30, ph: 3.6 },
    { c: '#222', x: 0.78, y: 0.48, s: 22, ph: 4.8 }
  ];
  for (var i = 0; i < stones.length; i++) {
    var sd = stones[i];
    var sx = sd.x * w + Math.cos(elapsed * 0.7 + sd.ph) * 5;
    var sy = sd.y * h + Math.sin(elapsed * 1.2 + sd.ph) * 8;
    ctx.fillStyle = sd.c;
    ctx.beginPath(); ctx.arc(sx, sy, sd.s, 0, Math.PI * 2); ctx.fill();
    if (sd.c === '#eee') { ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.strokeStyle = 'rgba(60,30,10,0.06)';
  ctx.lineWidth = 1;
  var gs = Math.min(w, h) * 0.3, gx = (w - gs) / 2, gy = (h - gs) / 2 - 40;
  for (i = 0; i <= 3; i++) {
    ctx.beginPath(); ctx.moveTo(gx, gy + i * gs / 3); ctx.lineTo(gx + gs, gy + i * gs / 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx + i * gs / 3, gy); ctx.lineTo(gx + i * gs / 3, gy + gs); ctx.stroke();
  }
  var chars = [
    { c: '棋', x: w / 2 - 32, d: 0.2 }, { c: '语', x: w / 2 + 32, d: 0.5 }
  ];
  ctx.font = 'bold 52px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var titleY = h * 0.32;
  for (i = 0; i < chars.length; i++) {
    var ch = chars[i];
    var a = Math.min(1, Math.max(0, (elapsed - ch.d) / 0.5));
    ctx.fillStyle = 'rgba(42,26,10,' + a + ')';
    ctx.fillText(ch.c, ch.x, titleY + (elapsed < ch.d ? 10 : 0));
  }
  var a1 = Math.min(1, Math.max(0, (elapsed - 0.6) / 0.5));
  ctx.font = '16px sans-serif';
  ctx.fillStyle = 'rgba(90,69,53,' + a1 + ')';
  ctx.fillText('璇机奥妙，涵在棋盘', w / 2, h * 0.46);
  var a2 = Math.min(1, Math.max(0, (elapsed - 0.9) / 0.5));
  ctx.fillStyle = 'rgba(90,69,53,' + a2 + ')';
  ctx.fillText('遇见棋盘是你我的奇遇', w / 2, h * 0.46 + 32);
  var rx = w / 2, ry = h - 75, rr = 20;
  ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(40,20,0,0.1)'; ctx.lineWidth = 3; ctx.stroke();
  var p = Math.min(1, elapsed / 5);
  ctx.beginPath(); ctx.arc(rx, ry, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
  ctx.strokeStyle = 'rgba(40,20,0,0.3)'; ctx.stroke();
  ctx.font = 'bold 18px sans-serif';
  ctx.fillStyle = '#3a2a1a';
  ctx.fillText(String(remaining), rx, ry);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#8a7a6a';
  ctx.fillText('点击跳过', rx, ry + 32);
  return { elapsed: elapsed, remaining: remaining };
}

function design_roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function design_draw(ctx, w, h) {

  ctx.fillRect(0, 0, w, 64);
  ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 64); ctx.lineTo(w, 64); ctx.stroke();
  ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 2;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(20, 32); ctx.lineTo(30, 23); ctx.moveTo(20, 32); ctx.lineTo(30, 41); ctx.stroke();
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  ctx.fillStyle = '#3a2a1a';
  ctx.font = 'bold 17px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('棋盘定制', w / 2, 32);
  var t = getTheme();
  var cardW = w - 32, cardX = 16, cardY = 80;
  var prevH = Math.min(160, h * 0.22);
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  design_roundRect(ctx, cardX + 2, cardY + 2, cardW, prevH + 28, 12); ctx.fill();
  ctx.fillStyle = '#fff';
  design_roundRect(ctx, cardX, cardY, cardW, prevH + 28, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1;
  design_roundRect(ctx, cardX, cardY, cardW, prevH + 28, 12); ctx.stroke();
  ctx.fillStyle = '#8a7a6a';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('效果预览', cardX + 14, cardY + 18);
  var pSize = prevH - 10, pX = cardX + (cardW - pSize) / 2, pY = cardY + 22;
  var c = pSize / 6;
  ctx.fillStyle = t.bg;
  ctx.fillRect(pX - 4, pY - 4, pSize + 8, pSize + 8);
  ctx.fillStyle = t.board;
  ctx.fillRect(pX, pY, pSize, pSize);
  ctx.strokeStyle = t.grid; ctx.lineWidth = 0.5;
  for (var i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(pX, pY + i * c * 2); ctx.lineTo(pX + pSize, pY + i * c * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pX + i * c * 2, pY); ctx.lineTo(pX + i * c * 2, pY + pSize); ctx.stroke();
  }
  ctx.fillStyle = t.grid;
  ctx.beginPath(); ctx.arc(pX + c * 2, pY + c * 3, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(pX + c * 4, pY + c * 3, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = t.black;
  ctx.beginPath(); ctx.arc(pX + c * 1.5, pY + c * 2.5, c * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = t.white;
  ctx.beginPath(); ctx.arc(pX + c * 3.5, pY + c * 2.5, c * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#999'; ctx.lineWidth = 0.5; ctx.stroke();
  ctx.fillStyle = t.black;
  ctx.beginPath(); ctx.arc(pX + c * 2.5, pY + c * 4, c * 0.42, 0, Math.PI * 2); ctx.fill();

  var sections = [
    { label: '棋子配色', key: 'stone', map: design_stones, sel: design_stone },

    var totalW = keys.length * optW + (keys.length - 1) * 8;
    var startX = (w - totalW) / 2;
    var oy = sy + 22;
    for (var j = 0; j < keys.length; j++) {
      var k = keys[j];
      var ox = startX + j * (optW + 8);

      var active = k === sec.sel;
      ctx.fillStyle = '#fff';

      if (active) {
        ctx.strokeStyle = '#8a6040'; ctx.lineWidth = 2;

        ctx.fillStyle = val.color;
        ctx.fillRect(ox + 6, oy + 15, optW - 12, 14);

function design_hitTest(mx, my, w, h) {
  if (mx >= 6 && mx <= 42 && my >= 8 && my <= 56) return 'back';
  var prevH = Math.min(160, h * 0.22);
  var cardY = 80, secY = cardY + prevH + 52, secH = 104;
  var sections = [
    { key: 'stone', map: design_stones, sel: design_stone, y: secY },
    { key: 'board', map: design_boards, sel: design_board, y: secY + secH },
    { key: 'bg',    map: design_bgs,    sel: design_bg,    y: secY + secH * 2 }
  ];
  for (var s = 0; s < sections.length; s++) {
    var sec = sections[s];
    var keys = Object.keys(sec.map);
    var optW = Math.min(52, (w - 40 - (keys.length - 1) * 8) / keys.length);
    var totalW = keys.length * optW + (keys.length - 1) * 8;
    var startX = (w - totalW) / 2;
    var oy = sec.y + 22;
    for (var j = 0; j < keys.length; j++) {
      var ox = startX + j * (optW + 8);
      if (mx >= ox && mx <= ox + optW && my >= oy && my <= oy + 64) {
        return sec.key + ':' + keys[j];
      }
    }
  }
  var btnY = h - 86;
  if (mx >= 20 && mx <= w - 20 && my >= btnY && my <= btnY + 48) return 'start';
  return null;
}

function design_selectHit(hit) {
  if (!hit || hit === 'back' || hit === 'start') return;
  var parts = hit.split(':');
  if (parts[0] === 'stone') design_stone = parts[1];
  else if (parts[0] === 'board') design_board = parts[1];
  else if (parts[0] === 'bg')    design_bg    = parts[1];
}

function invite_hitTest(mx, my, w, h) {
  if (mx >= 6 && mx <= 42 && my >= 8 && my <= 56) return 'back';
  var prevH = Math.min(120, h * 0.18), pY = 80;
  var secY = pY + prevH + 24;
  var btnW = w - 80, btnH = 40, btnX = 40, btnGap = 10;
  var b1Y = secY + 28;
  if (mx >= btnX && mx <= btnX + btnW && my >= b1Y && my <= b1Y + btnH) return 'local';
  var b2Y = b1Y + btnH + btnGap;
  if (mx >= btnX && mx <= btnX + btnW && my >= b2Y && my <= b2Y + btnH) return 'match';
  var b3Y = b2Y + btnH + btnGap;
  if (mx >= btnX && mx <= btnX + btnW && my >= b3Y && my <= b3Y + btnH) return 'create';
  var b4Y = b3Y + btnH + btnGap;
  if (mx >= btnX && mx <= btnX + btnW && my >= b4Y && my <= b4Y + btnH) return 'join';
  var startY = h - 90;
  if (mx >= 20 && mx <= w - 20 && my >= startY && my <= startY + 50) return 'start';
  return null;
}

function invite_handleTouch(hit, onReady) {
  if (hit === 'local') { invite_mode = 'local'; invite_roomCode = ''; invite_statusText = ''; network_reset(); isOnline = false; return true; }
  if (hit === 'match') {
    if (typeof WS === 'undefined' || !WS.isConnected()) { showToast('未连接到服务器，请稍候重试', 2000); return true; }
    invite_mode = 'match'; invite_roomCode = ''; WS.match();
    showToast('正在匹配对手…', 3000); return true;
  }
  if (hit === 'create') {
    if (typeof WS === 'undefined' || !WS.isConnected()) { showToast('未连接到服务器，请稍候重试', 2000); return true; }
    invite_mode = 'create'; WS.createRoom();
    showToast('正在创建房间…', 2000); return true;
  }
  if (hit === 'join') {
    invite_mode = 'join'; invite_roomCode = '';
    var code = prompt('请输入房间号：');
    if (!code || !code.trim()) { invite_mode = 'local'; return true; }
    code = code.trim().toUpperCase();
    if (typeof WS === 'undefined' || !WS.isConnected()) { showToast('未连接到服务器', 2000); invite_mode = 'local'; return true; }
    invite_roomCode = code;
    WS.joinRoom(code);
    showToast('正在加入房间 ' + code + '…', 2000); return true;
  }
  if (hit === 'start') {
    if (invite_mode === 'local') { onReady({ online: false }); return false; }
    if (invite_mode === 'match') { showToast('正在匹配对手，请稍候…', 2000); return true; }
    if (invite_mode === 'create') { showToast('等待对手加入房间…', 2000); return true; }
    if (invite_mode === 'join') { showToast('等待加入房间…', 2000); return true; }
  }
  return false;
}

var online_myColor = null;
var online_roomCode = null;
var online_opponentMoveHandler = null;
var network_remoteMoveSeq = 0;   // 对手最后一步序号，用于去重
var network_localMoveSeq = 0;    // 本地最后发送的序号
var network_syncPending = false; // 是否正在同步中

function boardHash() {
  // 计算当前棋局哈希（用于双方快速比对状态）
  var parts = [];
  stoneMap.forEach(function(s, k) { parts.push(k + ':' + s.color); });
  parts.sort();
  return parts.join('|').slice(0, 20) || 'empty';
}

function network_isOnline() { return isOnline; }
function network_myColor()  { return online_myColor; }
function network_roomCode() { return online_roomCode; }
function network_onOpponentMove(fn) { online_opponentMoveHandler = fn; }
function network_syncMove(x, y, color) {
  network_localMoveSeq++;
  if (typeof WS !== 'undefined') WS.sendMove(x, y, color);
}
function network_endGame() { network_remoteMoveSeq = 0; network_localMoveSeq = 0; network_syncPending = false; }
function network_setOnline(color, room) { online_myColor = color; online_roomCode = room; network_remoteMoveSeq = 0; network_localMoveSeq = 0; network_syncPending = false; }
function network_reset() { online_myColor = null; online_roomCode = null; online_opponentMoveHandler = null; network_remoteMoveSeq = 0; network_localMoveSeq = 0; network_syncPending = false; }

// ── WS 事件注册（初始化时执行一次）──
(function _initWS() {
  if (typeof WS === 'undefined') return;
  WS.on('matched', function(data) {
    if (invite_mode !== 'match') return;
    invite_roomCode = data.room;
    network_setOnline(data.color, data.room);
    isOnline = true;
    showToast('匹配成功！你执' + (data.color === 'B' ? '⚫黑棋' : '⚪白棋'), 2500);
    enterGame();
  });
  WS.on('room_created', function(data) {
    invite_roomCode = data.room; online_roomCode = data.room;
    showToast('房间已创建！', 2000);
  });
  WS.on('opponent_joined', function(data) {
    if (invite_mode === 'create' && STATE === 'INVITE') {
      network_setOnline(data.color === 'B' ? 'W' : 'B', online_roomCode);
      isOnline = true;
      showToast('对手已加入！对局开始', 2000);
      enterGame();
    }
  });
  WS.on('room_joined', function(data) {
    invite_roomCode = data.room;
    network_setOnline(data.color, data.room);
    isOnline = true;
    showToast('成功加入房间！你执' + (data.color === 'B' ? '⚫黑棋' : '⚪白棋'), 2500);
    enterGame();
  });
  WS.on('move', function(data) {
    if (!isOnline || STATE !== 'GAME') return;
    // 去重：如果该位置已经有棋子且颜色匹配，说明是重复消息，忽略
    var k = data.x + ',' + data.y;
    if (stoneMap.has(k) && stoneMap.get(k).color === data.color) {
      // 重复消息，忽略但更新序号
      if (data.seq !== undefined) network_remoteMoveSeq = Math.max(network_remoteMoveSeq, data.seq);
      return;
    }
    // 序号跳跃检测：如果跳过了步骤，标记需要同步
    if (data.seq !== undefined && data.seq > network_remoteMoveSeq + 1 && network_remoteMoveSeq > 0) {
      showToast('检测到棋局不同步，建议点击🔄同步', 3000);
    }
    network_remoteMoveSeq = data.seq !== undefined ? data.seq : network_remoteMoveSeq + 1;
    var r = placeStone(data.x, data.y, stoneMap, moves, currentIdx, koPoint);
    if (r.success) {
      currentIdx = moves.length - 1;
      currentColor = moves.length % 2 === 0 ? 'B' : 'W';
      koPoint = r.koPoint || null;
      myTurn = true;
      if (data.color === 'B') playBlack(); else playWhite();
      if (isDoublePass(moves)) doEndGame();
    } else if (r.reason === 'occupied') {
      // 位置已被占用，请求同步
      showToast('棋局状态不一致，正在自动同步…', 2500);
      doSyncGame();
    }
  });
  WS.on('pass', function(data) {
    if (!isOnline || STATE !== 'GAME') return;
    // 去重：检查上一步是否已经是pass
    var lastMove = moves.length > 0 ? moves[moves.length - 1] : null;
    if (lastMove && lastMove.x < 0) {
      network_remoteMoveSeq = data.seq !== undefined ? Math.max(network_remoteMoveSeq, data.seq) : network_remoteMoveSeq + 1;
      return; // 重复pass，忽略
    }
    network_remoteMoveSeq = data.seq !== undefined ? data.seq : network_remoteMoveSeq + 1;
    passMove(stoneMap, moves, currentIdx, koPoint);
    currentIdx = moves.length - 1;
    currentColor = moves.length % 2 === 0 ? 'B' : 'W';
    koPoint = null; myTurn = true;
    if (isDoublePass(moves)) doEndGame();
  });
  WS.on('resign', function(data) {
    if (!isOnline || STATE !== 'GAME') return;
    showToast('对手认输！你赢了 🎉', 3000);
    gameResult = { winner: online_myColor || (data.color === 'B' ? 'W' : 'B'), diff: 0,
      blackTerritory: 0, whiteTerritory: 0, blackStones: 0, whiteStones: 0, resign: true };
    doEndGame();
  });
  WS.on('disconnect', function() { showToast('对手已断开连接', 3500); });
  WS.on('reconnected', function() {
    if (isOnline && STATE === 'GAME') {
      showToast('网络已恢复，正在同步棋局…', 2500);
      setTimeout(function() { doSyncGame(); }, 500);
    }
  });
  WS.on('error', function(data) { showToast(data.msg || '服务器错误，请重试', 2500); });
  WS.on('leaderboard', function(data) { leaderboard_globalLoading = false; leaderboard_globalData = data; });
  // 数子申请流程
  WS.on('count_requested', function(data) {
    if (!isOnline || STATE !== 'GAME') return;
    showModal('数子申请', '对手申请数子，是否同意？\n同意后将根据中国围棋规则（数子法）判定胜负。',
      function() {
        WS.send({ type: 'agree_count' });
        countingRequested = false;
        gameResult = calculateScore(stoneMap);
        doEndGame();
      },
      function() {
        WS.send({ type: 'reject_count' });
        showToast('已拒绝数子申请，对局继续', 2000);
      }
    );
  });
  WS.on('count_agreed', function(data) {
    if (!isOnline || STATE !== 'GAME') return;
    countingRequested = false;
    showToast('对手同意数子，正在计算胜负…', 2000);
    gameResult = calculateScore(stoneMap);
    doEndGame();
  });
  WS.on('count_rejected', function(data) {
    countingRequested = false;
    showToast('对手拒绝数子申请，对局继续', 2500);
  });
  // 对局内聊天
  WS.on('game_chat', function(data) {
    if (STATE !== 'GAME') return;
    gameChatMessages.push({name:data.name||'对手',avatar:data.avatar||'😊',msg:data.msg||'',time:data.time||Date.now(),isMe:false});
    if (gameChatMessages.length > gameChatMax) gameChatMessages.shift();
  });
})();

var auth_accounts = null;
var auth_currentUserId = null;

// 简易 SHA-256 哈希（兼容所有浏览器，不依赖 SubtleCrypto）
function auth_simpleHash(str) {
  var hash = 0, i, chr;
  if (str.length === 0) return '0';
  for (i = 0; i < str.length; i++) {
    chr = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + chr;
    hash |= 0;
  }
  var h = Math.abs(hash).toString(16);
  while (h.length < 8) h = '0' + h;
  // 多轮迭代增加安全性
  for (var r = 0; r < 3; r++) {
    var h2 = 0;
    for (i = 0; i < h.length; i++) {
      h2 = ((h2 << 5) - h2) + h.charCodeAt(i);
      h2 |= 0;
    }
    h = Math.abs(h2).toString(16);
    while (h.length < 8) h = '0' + h;
  }
  return h;
}

function auth_genUserId() {
  return 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function auth_loadAccounts() {
  if (auth_accounts) return auth_accounts;
  try {
    var raw = storageGet('hc_accounts');
    auth_accounts = raw ? JSON.parse(raw) : {};
  } catch(e) { auth_accounts = {}; }
  if (!auth_currentUserId) {
    var saved = storageGet('hc_currentUser');
    if (saved && auth_accounts[saved]) auth_currentUserId = saved;
  }
  return auth_accounts;
}

function auth_saveAccounts() {
  storageSet('hc_accounts', JSON.stringify(auth_accounts || {}));
}

function auth_getCurrentUser() {
  auth_loadAccounts();
  if (!auth_currentUserId || !auth_accounts[auth_currentUserId]) return null;
  return auth_accounts[auth_currentUserId];
}

function auth_getUserId() { return auth_currentUserId; }

function auth_isLoggedIn() { return !!auth_getCurrentUser(); }

function auth_loginSync(name, password) {
  auth_loadAccounts();
  var hash = auth_simpleHash(password);
  var keys = Object.keys(auth_accounts);
  for (var i = 0; i < keys.length; i++) {
    var u = auth_accounts[keys[i]];
    if (u.name === name && u.passwordHash === hash) {
      auth_currentUserId = u.id;
      storageSet('hc_currentUser', auth_currentUserId);
      return { success: true };
    }
  }
  return { success: false, error: '用户名或密码错误' };
}

function auth_register(name, password, avatar) {
  if (!name || !name.trim()) return { success: false, error: '请输入用户名' };
  name = name.trim().slice(0, 8);
  if (!password || password.length < 4) return { success: false, error: '密码至少4位' };
  auth_loadAccounts();
  var keys = Object.keys(auth_accounts);
  for (var i = 0; i < keys.length; i++) {
    if (auth_accounts[keys[i]].name === name) return { success: false, error: '用户名已存在' };
  }
  var id = auth_genUserId();
  var user = {
    id: id,
    name: name,
    passwordHash: auth_simpleHash(password),
    avatar: avatar || '😊',
    customAvatar: '',
    createdAt: Date.now()
  };
  auth_accounts[id] = user;
  auth_saveAccounts();
  auth_currentUserId = id;
  storageSet('hc_currentUser', auth_currentUserId);
  return { success: true };
}

function auth_logout() {
  auth_currentUserId = null;
  storageRemove('hc_currentUser');
  account_profile = null;
  account_customAvatar = null;
  account_imgCache = null;
  history_records = [];
  history_loaded = false;
}

function auth_init() {
  auth_loadAccounts();
  // 迁移旧数据
  if (Object.keys(auth_accounts).length === 0) {
    var oldProfile = null;
    try { var raw = storageGet('hc_profile'); oldProfile = raw ? JSON.parse(raw) : null; } catch(e) {}
    if (oldProfile) {
      var id = auth_genUserId();
      var migratedUser = {
        id: id,
        name: oldProfile.name || '棋手',
        passwordHash: auth_simpleHash('1234'),
        avatar: oldProfile.avatar || '😊',
        customAvatar: oldProfile.customAvatar || '',
        createdAt: Date.now()
      };
      auth_accounts[id] = migratedUser;
      auth_saveAccounts();
      // 迁移旧历史
      try {
        var oldHistory = storageGet('hc_history');
        if (oldHistory) storageSet('hc_history_' + id, oldHistory);
      } catch(e) {}
      // 迁移旧对局
      try {
        var oldGame = storageGet('hc_game');
        if (oldGame) storageSet('hc_game_' + id, oldGame);
      } catch(e) {}
      // 自动登录
      auth_currentUserId = id;
      storageSet('hc_currentUser', id);
      storageRemove('hc_profile');
      storageRemove('hc_history');
      storageRemove('hc_game');
      return; // 迁移完成，已登录
    }
    storageRemove('hc_profile');
  }
  // 自动登录（已登录用户免登录）
  if (!auth_currentUserId) {
    var saved = storageGet('hc_currentUser');
    if (saved && auth_accounts[saved]) {
      auth_currentUserId = saved;
    }
  }
}

function auth_showModal(mode) {

// Module: utils/history.js (localStorage version)
// ============================================================
var history_records = [];
var history_loaded = false;
var history_loading = false;
var history_scrollOffset = 0;
var history_screenH = 600;

function history_load(cb) {
  if (history_loading) return;
  history_loading = true;
  var uid = auth_getUserId();
  var key = uid ? 'hc_history_' + uid : 'hc_history';
  try {
    var raw = storageGet(key);
    history_records = raw ? JSON.parse(raw) : [];
  } catch(e) { history_records = []; }
  history_loaded = true;
  history_loading = false;
  if (cb) cb(history_records);
}

function history_saveRecord(record) {
  history_records.unshift(record);
  if (history_records.length > 30) history_records.length = 30;
  var uid = auth_getUserId();
  var key = uid ? 'hc_history_' + uid : 'hc_history';
  storageSet(key, JSON.stringify(history_records));
  history_loaded = true;
}

function history_rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function history_draw(ctx, w, h) {
  ctx.fillStyle = '#faf5eb';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(250,245,235,0.95)';
  ctx.fillRect(0, 0, w, 64);
  ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,64); ctx.lineTo(w,64); ctx.stroke();
  ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 2;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(20,32); ctx.lineTo(30,23); ctx.moveTo(20,32); ctx.lineTo(30,41); ctx.stroke();
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  ctx.fillStyle = '#3a2a1a';
  ctx.font = 'bold 17px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('历史对局', w/2, 32);
  if (!history_loaded) {
    ctx.fillStyle = '#8a7a6a';
    ctx.font = '14px sans-serif';
    ctx.fillText('加载中…', w/2, h/2);
    return;
  }
  if (!history_records.length) {
    ctx.fillStyle = '#8a7a6a';
    ctx.font = '14px sans-serif';
    ctx.fillText('暂无对局记录', w/2, h/2);
    ctx.font = '12px sans-serif';
    ctx.fillText('完成一局对局后自动记录', w/2, h/2+24);
    return;
  }
  var cardW = w - 32, cardX = 16, cardH = 68, gap = 10;
  var startY = 80 - history_scrollOffset;
  var visibleEnd = h - 20;
  for (var i = 0; i < history_records.length; i++) {
    var cy = startY + i * (cardH + gap);
    if (cy + cardH < 70) continue;
    if (cy > visibleEnd) break;
    var rec = history_records[i];
    var winner = rec.winner === 'B' ? '⚫ 黑胜' : '⚪ 白胜';
    ctx.fillStyle = '#fff';
    history_rrect(ctx, cardX, cy, cardW, cardH, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
    history_rrect(ctx, cardX, cy, cardW, cardH, 10); ctx.stroke();
    ctx.fillStyle = rec.winner === 'B' ? '#3a2a1a' : '#6a5a4a';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(winner, cardX+14, cy+12);
    ctx.fillStyle = '#8a7a6a';
    ctx.font = '11px sans-serif';
    var detail = (rec.resign ? '认输 · ' : '') + rec.totalMoves + '手 · 差' + rec.diff + '目';
    if (rec.blackTerr !== undefined) {
      detail += ' · 黑' + (rec.blackTerr+rec.blackStones) + '目 白' + (rec.whiteTerr+rec.whiteStones) + '目';
    }
    ctx.fillText(detail, cardX+14, cy+36);
    var d = new Date(rec.createdAt);
    var dateStr = (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    ctx.fillText(dateStr, cardX+14, cy+52);
    ctx.fillStyle = '#ccc';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('›', cardX+cardW-16, cy+cardH/2);
  }
  if (history_records.length > 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('↓ 滚轮滑动查看更多 ↓', w/2, h-16);
  }
}

function history_hitTest(mx, my, w, h) {
  if (mx >= 6 && mx <= 42 && my >= 8 && my <= 56) return 'back';
  return null;
}

function history_setScreenH(h) { history_screenH = h; }
function history_scroll(delta) {
  var maxScroll = Math.max(0, history_records.length * 78 - history_screenH + 200);
  history_scrollOffset = Math.max(0, Math.min(maxScroll, history_scrollOffset + delta));
}

function boardCoord(x, y) {

function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  offCanvas.width  = W * dpr;
  offCanvas.height = H * dpr;
  offCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  offCtx.imageSmoothingEnabled = false;
  layout = calcLayout(W, H);
}

function getEventPos(e) {
  var rect = canvas.getBoundingClientRect();
  return { mx: e.clientX - rect.left, my: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', function(e) {
  var pos = getEventPos(e);
  if (STATE === 'SPLASH')       enterMenu();
  else if (STATE === 'MENU')    handleMenuTouch(pos.mx, pos.my);
  else if (STATE === 'DESIGN')  handleDesignTouch(pos.mx, pos.my);
  else if (STATE === 'INVITE')  handleInviteTouch(pos.mx, pos.my);
  else if (STATE === 'HISTORY')    handleHistoryTouch(pos.mx, pos.my);
  else if (STATE === 'LEADERBOARD') handleLeaderboardTouch(pos.mx, pos.my);
  else if (STATE === 'FORUM')       handleForumTouch(pos.mx, pos.my);
  else if (STATE === 'ACCOUNT')     handleAccountTouch(pos.mx, pos.my);
  else if (STATE === 'GAME')        handleGameTouch(pos.mx, pos.my);
});

canvas.addEventListener('wheel', function(e) {
  if (STATE === 'HISTORY') { e.preventDefault(); history_scroll(e.deltaY); }
  else if (STATE === 'LEADERBOARD') { e.preventDefault(); leaderboard_scroll(e.deltaY); }
  else if (STATE === 'FORUM') { e.preventDefault(); forum_scroll(e.deltaY); }
}, { passive: false });

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && STATE === 'GAME') {
    endGameCleanup(); STATE = 'DESIGN';
  }
});

    errEl.textContent = result.error;
  }
});
document.getElementById('regBtn').addEventListener('click', function() {
  var name = document.getElementById('regUser').value.trim();
  var pass = document.getElementById('regPass').value;
  var pass2 = document.getElementById('regPass2').value;
  var errEl = document.getElementById('regErr');
  errEl.textContent = '';
  if (!name) { errEl.textContent = '请输入用户名'; return; }
  if (name.length < 1 || name.length > 8) { errEl.textContent = '用户名需1-8个字符'; return; }
  if (!pass || pass.length < 4) { errEl.textContent = '密码至少4位'; return; }
  if (pass !== pass2) { errEl.textContent = '两次密码不一致'; return; }
  var result = auth_register(name, pass, _regSelectedAvatar);
  if (result.success) {
    auth_hideModal();
    showToast('注册成功！欢迎，' + name + '！', 2000);
    STATE = 'MENU';
  } else {
    errEl.textContent = result.error;
  }
});
// 点遮罩关闭弹窗
document.getElementById('authOverlay').addEventListener('click', function() { auth_hideModal(); });
// 落子确认按钮
document.getElementById('moveOkBtn').addEventListener('click', confirmMove);
document.getElementById('moveCancelBtn').addEventListener('click', cancelMove);
document.getElementById('moveOverlay').addEventListener('click', cancelMove);
// 网站信息弹窗按钮
document.getElementById('infoOkBtn').addEventListener('click', hideInfoModal);
document.getElementById('infoOverlay').addEventListener('click', hideInfoModal);
// 回车键提交
document.getElementById('loginPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
document.getElementById('regPass2').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('regBtn').click();
});

function loop() {
  offCtx.clearRect(0, 0, W, H);
  var c = offCtx;
  if (STATE === 'SPLASH') {
    var r = splash_draw(c, W, H);
    if (r.elapsed >= 5) enterMenu();
  } else if (STATE === 'MENU') {
    drawMenu(c, W, H);
  } else if (STATE === 'DESIGN') {
    design_draw(c, W, H);
  } else if (STATE === 'INVITE') {
    invite_draw(c, W, H, theme);
  } else if (STATE === 'HISTORY') {
    history_draw(c, W, H);
  } else if (STATE === 'LEADERBOARD') {
    leaderboard_draw(c, W, H);
  } else if (STATE === 'FORUM') {
    forum_draw(c, W, H);
  } else if (STATE === 'ACCOUNT') {
    account_draw(c, W, H);
  } else if (STATE === 'GAME') {
    drawGameScene(c);
  }
  ctx.drawImage(offCanvas, 0, 0, W * dpr, H * dpr, 0, 0, W, H);
  rafId = requestAnimationFrame(loop);
}

function enterMenu()  {
  if (STATE !== 'MENU') STATE = 'MENU';
  // 未登录强制弹登录/注册
  if (!auth_isLoggedIn()) {
    var accounts = auth_loadAccounts();
    var hasAccounts = Object.keys(accounts).length > 0;
    auth_showModal(hasAccounts ? 'login' : 'register');
  }
}
function enterDesign(){ STATE = 'DESIGN'; }
function enterGame()  {
  theme = getTheme();
  if (isOnline) { stoneMap.clear(); moves = []; currentIdx = -1; currentColor = 'B'; }
  else if (!restoreGame()) { stoneMap.clear(); moves = []; currentIdx = -1; currentColor = 'B'; }
  isOnline = network_isOnline();
  myTurn   = isOnline ? (network_myColor() === 'B') : true;
  koPoint = null;
  gameResult = null;
  countingRequested = false;
  pendingMove = null;
  gameChatMessages = [];
  if (isOnline) {
    var chatBar = document.getElementById('chatBar');
    if (chatBar) {
      chatBar.classList.add('show');
      var chatInputEl = document.getElementById('chatInput');
      if (chatInputEl) chatInputEl.placeholder = '对局聊天…';
    }
  }
  STATE = 'GAME';
}

function handleMenuTouch(mx, my) {
  var hit = menuHitTest(mx, my, W, H);
  if (hit === 'duiju') enterDesign();
  else if (hit === 'account') { if (auth_isLoggedIn()) { account_load(); STATE = 'ACCOUNT'; } else { auth_showModal('login'); } }
  else if (hit === 'history') { history_load(); STATE = 'HISTORY'; }
  else if (hit === 'rank') { leaderboard_open(); }
  else if (hit === 'forum') { forum_enter(); }
  else if (hit === 'info') { showInfoModal(); }
}

// ── 网站信息弹窗 ──
function showInfoModal() {
  var modal = document.getElementById('infoModal');
  if (modal) modal.classList.add('show');
}
function hideInfoModal() {
  var modal = document.getElementById('infoModal');
  if (modal) modal.classList.remove('show');
}

function handleDesignTouch(mx, my) {
  var hit = design_hitTest(mx, my, W, H);
  if (!hit) return;
  if (hit === 'back') STATE = 'MENU';
  else if (hit === 'start') STATE = 'INVITE';
  else design_selectHit(hit);
}

function handleHistoryTouch(mx, my) {
  var hit = history_hitTest(mx, my, W, H);
  if (hit === 'back') STATE = 'MENU';
}

function handleInviteTouch(mx, my) {
  var hit = invite_hitTest(mx, my, W, H);
  if (!hit) return;
  if (hit === 'back') { invite_reset(); STATE = 'DESIGN'; return; }
  invite_handleTouch(hit, function (res) {
    if (res && !res.err) {
      if (res.online !== false) {
        network_onOpponentMove(function (m) {
          if (m.x < 0) {
            passMove(stoneMap, moves, currentIdx, koPoint);
            koPoint = null;
          } else {
            var r = placeStone(m.x, m.y, stoneMap, moves, currentIdx, koPoint);
            if (r.success) koPoint = r.koPoint || null;
          }
          currentIdx = moves.length - 1;
          currentColor = moves.length % 2 === 0 ? 'B' : 'W';
          myTurn = true;
          if (m.x >= 0) {
            if (m.color === 'B') playBlack();
            else playWhite();
          }
          if (isDoublePass(moves)) doEndGame();
        });
      }
      enterGame();
    }
  });
}

function drawGameChat(c, w, h) {
  if (!isOnline) return;
  var barY = h - 120;                              // bottom bar top
  var chatH = 80;                                   // fixed chat area height (reserved in calcLayout)
  var chatY = barY - chatH;                         // chat sits right above bottom bar

  // 聊天背景区
  c.fillStyle = 'rgba(18,20,32,0.85)';
  c.fillRect(4, chatY, w - 8, chatH);
  c.strokeStyle = 'rgba(200,169,110,0.12)';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(4, chatY); c.lineTo(w - 4, chatY); c.stroke();
  c.beginPath(); c.moveTo(4, barY); c.lineTo(w - 4, barY); c.stroke();

  if (gameChatMessages.length === 0) {
    // 提示文字
    c.fillStyle = 'rgba(160,150,130,0.5)';
    c.font = '12px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('💬 对局聊天 — 下方输入消息', w / 2, chatY + chatH / 2);
    c.textAlign = 'left';
    return;
  }

  // 显示最近的消息（从下往上排，不超过chatH）
  var lineH = 20;
  var maxShow = Math.floor((chatH - 8) / lineH);
  var startIdx = Math.max(0, gameChatMessages.length - maxShow);
  var textY = chatY + chatH - 6;

  for (var i = gameChatMessages.length - 1; i >= startIdx && textY > chatY + 4; i--) {
    var msg = gameChatMessages[i];
    var prefix = msg.isMe ? '💬' : '💭';
    var displayName = (msg.isMe ? '我' : (msg.name || '对手')).slice(0, 4);
    var text = prefix + ' ' + displayName + ': ' + (msg.msg || '');
    var maxChars = Math.floor((w - 20) / 7);
    if (text.length > maxChars) text = text.slice(0, maxChars - 2) + '…';

    c.font = '12px sans-serif';
    c.textAlign = 'left';
    c.textBaseline = 'bottom';
    c.fillStyle = msg.isMe ? 'rgba(180,220,180,0.9)' : 'rgba(220,210,190,0.9)';
    c.fillText(text, 10, textY);
    textY -= lineH;
  }
  c.textAlign = 'left';
}

function drawGameScene(c) {
  c.fillStyle = theme.bg;
  c.fillRect(0, 0, W, H);
  drawBgDecor(c, W, H, layout);
  drawBoard(c, layout, theme);
  drawStones(c, stoneMap, moves, currentIdx, layout, theme);
  // 待确认落子位置预览光圈
  if (pendingMove) {
    var px = layout.offsetX + board_gx(pendingMove.x, layout.CL, layout.PD);
    var py = layout.offsetY + board_gy(pendingMove.y, layout.CL, layout.PD);
    var color = moves.length % 2 === 0 ? 'B' : 'W';
    var pc = color === 'B' ? 'rgba(26,26,26,0.85)' : 'rgba(248,244,236,0.95)';
    var ring = color === 'B' ? '#6a8a60' : '#d08060';
    c.beginPath(); c.arc(px, py, layout.SR, 0, Math.PI * 2); c.fillStyle = pc; c.fill();
    if (color === 'W') { c.strokeStyle = '#c0b8a8'; c.lineWidth = 1; c.stroke(); }
    c.strokeStyle = ring; c.lineWidth = 2.5; c.setLineDash([5, 4]);
    c.beginPath(); c.arc(px, py, layout.SR + 5, 0, Math.PI * 2); c.stroke();
    c.setLineDash([]);
    // 显示坐标
    c.fillStyle = color === 'B' ? '#ccc' : '#444';
    c.font = 'bold ' + Math.floor(layout.CL * 0.34) + 'px sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(boardCoord(pendingMove.x, pendingMove.y), px, py + 1);
  }
  drawTopBar(c, W, currentColor, moves.length, isOnline, myTurn);
  drawBottomBar(c, W, H);
  if (gameResult) drawResultPopup(c, W, H, gameResult);
}

function handleGameTouch(mx, my) {
  if (gameResult) {
    if (popupHitTest(mx, my, W, H) === 'menu') { endGameCleanup(); STATE = 'MENU'; }
    return;
  }
  var hit = board_hitTest(mx, my, W, H, layout);
  if (!hit) return;
  if (hit === 'back') {
    if (isOnline) { endGameCleanup(); STATE = 'DESIGN'; }
    else if (moves.length > 0) {
      // 本地对局：退出前确认并清空棋盘
      showModal('退出对局', '退出将清空当前棋盘（对局记录不保留），确定退出吗？', function() {
        var uid = auth_getUserId();
        var key = uid ? 'hc_game_' + uid : 'hc_game';
        storageRemove(key);
        endGameCleanup();
        STATE = 'DESIGN';
      });
    } else {
      endGameCleanup(); STATE = 'DESIGN';
    }
  }
  else if (hit === 'undo')   doUndo();
  else if (hit === 'pass' || hit === 'pass2') doPass();
  else if (hit === 'clear')  doClear();
  else if (hit === 'resign') doResign();
  else if (hit === 'rematch') doRematch();
  else if (hit === 'count')  doRequestCounting();
  else if (hit === 'sync')   doSyncGame();
  else if (hit === 'board') {
    if (isOnline && !myTurn) return;
    var pos = pixelToBoard(mx, my, layout);
    if (pos) requestPlace(pos.x, pos.y);
  }
}

// ── 落子确认流程 ──
function requestPlace(x, y) {
  // 预检：该位置是否合法落子（占用/劫/禁着点）
  var k = x + ',' + y;
  if (stoneMap.has(k)) { showToast('该位置已有棋子', 1200); return; }
  if (isKo(x, y, stoneMap, koPoint)) { showToast('打劫！不能立刻回提', 1500); return; }
  var testMap = new Map(stoneMap);
  var testMoves = moves.slice();
  var tr = placeStone(x, y, testMap, testMoves, currentIdx, koPoint);
  if (!tr.success && tr.reason === 'suicide') { showToast('禁着点，不可落子', 1200); return; }

  pendingMove = { x: x, y: y };
  var color = moves.length % 2 === 0 ? 'B' : 'W';
  var coord = boardCoord(x, y);
  var stoneColor = color === 'B' ? '#1a1a1a' : '#f8f4ec';
  var stoneBorder = color === 'B' ? '' : '2px solid #c0b8a8';
  document.getElementById('movePos').textContent = '落子 ' + coord;
  document.getElementById('movePreview').innerHTML =
    '<span class="mv-stone" style="background:' + stoneColor + ';' + stoneBorder + '"></span>';
  document.getElementById('moveErr').textContent = '';
  // 弹窗定位到棋盘正下方，不遮挡棋盘
  var boardBottom = layout.offsetY + layout.boardSize;
  var topPos = boardBottom + 6;
  var maxTop = window.innerHeight - 250; // 预留弹窗高度，避免超出屏幕
  if (topPos > maxTop) topPos = maxTop;
  document.getElementById('moveCard').style.top = topPos + 'px';
  document.getElementById('moveModal').classList.add('show');
}

function confirmMove() {
  if (!pendingMove) return;
  var x = pendingMove.x, y = pendingMove.y;
  pendingMove = null;
  document.getElementById('moveModal').classList.remove('show');
  doPlace(x, y);
}

function cancelMove() {
  pendingMove = null;
  document.getElementById('moveModal').classList.remove('show');
}

function doPlace(x, y) {
  if (isOnline && !myTurn) return;
  var r = placeStone(x, y, stoneMap, moves, currentIdx, koPoint);
  if (r.success) {
    currentIdx = moves.length - 1;
    currentColor = moves.length % 2 === 0 ? 'B' : 'W';
    koPoint = r.koPoint || null;
    saveGame();
    if (r.color === 'B') playBlack();
    else                 playWhite();
    if (isOnline) { network_syncMove(x, y, r.color); myTurn = false; }
    if (isDoublePass(moves)) doEndGame();
  } else if (r.reason === 'ko') {
    showToast('打劫！不能立刻回提', 1500);
  } else if (r.reason === 'suicide') {
    showToast('禁着点，不可落子', 1200);
  }
}

function doPass() {
  if (isOnline && !myTurn) return;
  var r = passMove(stoneMap, moves, currentIdx, koPoint);
  if (r.success) {
    currentIdx = moves.length - 1;
    currentColor = moves.length % 2 === 0 ? 'B' : 'W';
    koPoint = null;
    saveGame();
    if (isOnline && typeof WS !== 'undefined') { WS.sendPass(); myTurn = false; }
    if (isDoublePass(moves)) doEndGame();
  }
}

function doRequestCounting() {
  if (isOnline && !myTurn) return;
  if (!moves.length) { showToast('棋盘上还没有棋子', 1500); return; }

  if (isOnline) {
    if (countingRequested) {
      // 我方已申请，等待对手确认中
      showToast('已提交数子申请，等待对手确认…', 2000);
      return;
    }
    countingRequested = true;
    if (typeof WS !== 'undefined') WS.send({ type: 'request_count' });
    showToast('已发送数子申请，等待对手同意…', 2500);
    setTimeout(function() {
      if (countingRequested && STATE === 'GAME') {
        countingRequested = false;
        showToast('数子申请超时，对手未回应', 2000);
      }
    }, 30000);
    return;
  }

  // 本地双人模式：两步确认
  if (countingRequested) {
    // 第二步：另一方确认
    countingRequested = false;
    showToast('双方同意数子，正在计算胜负…', 2000);
    gameResult = calculateScore(stoneMap);
    doEndGame();
    return;
  }

  // 第一步：申请数子
  countingRequested = true;
  var who = currentColor === 'B' ? '⚫黑方' : '⚪白方';
  showToast(who + '申请数子！请对方点击「🧮 确认数子」确认', 2800);
}

function doSyncGame() {
  if (!isOnline) return;
  if (network_syncPending) { showToast('同步请求已发送，请稍候…', 1500); return; }
  network_syncPending = true;
  // 构建当前完整状态
  var stateMsg = {
    type: 'sync_request',
    moves: moves.map(function(m) { return { x: m.x, y: m.y, color: m.color }; }),
    currentIdx: currentIdx,
    myColor: online_myColor,
    hash: boardHash(),
    room: online_roomCode
  };
  if (typeof WS !== 'undefined') WS.send(stateMsg);
  showToast('正在同步棋局状态…', 2000);
  // 超时重置
  setTimeout(function() {
    if (network_syncPending) {
      network_syncPending = false;
      showToast('同步超时，请重试', 2000);
    }
  }, 8000);
}

// WS: 接收对局状态同步
WS.on('game_state', function(data) {
  network_syncPending = false;
  if (!isOnline || STATE !== 'GAME') return;
  if (!data || !data.moves) { showToast('同步失败：无效的状态数据', 2000); return; }

  // 重建棋盘
  stoneMap.clear();
  moves = [];
  currentIdx = -1;
  koPoint = null;
  for (var i = 0; i < data.moves.length; i++) {
    var m = data.moves[i];
    if (m.x >= 0) {
      var r = placeStone(m.x, m.y, stoneMap, moves, currentIdx, koPoint);
      if (r.success) {
        currentIdx = moves.length - 1;
        koPoint = r.koPoint || null;
      }
    } else {
      passMove(stoneMap, moves, currentIdx, koPoint);
      currentIdx = moves.length - 1;
      koPoint = null;
    }
  }
  currentColor = moves.length % 2 === 0 ? 'B' : 'W';
  network_remoteMoveSeq = moves.length;
  // 如果服务器告诉我们当前轮到谁
  if (data.currentColor) currentColor = data.currentColor;
  myTurn = (online_myColor === currentColor);
  showToast('棋局同步完成 ✅', 2000);
});

function doResign() {
  if (isOnline && !myTurn) return;
  showModal('认输', '确定认输吗？', function() {
    gameResult = { winner: currentColor === 'B' ? 'W' : 'B', diff: 0,
      blackTerritory: 0, whiteTerritory: 0, blackStones: 0, whiteStones: 0,
      resign: true };
    if (isOnline && typeof WS !== 'undefined') { WS.sendResign(); myTurn = false; }
    doEndGame();
  });
}

function doRematch() {
  if (isOnline) { showToast('联网对局不支持重开', 1500); return; }
  showModal('重新开局', '确定清空棋盘重新开始吗？', function() {
    stoneMap.clear(); moves = []; currentIdx = -1; currentColor = 'B';
    koPoint = null; gameResult = null; myTurn = true;
    storageRemove('hc_game');
  });
}

function doEndGame() {
  if (!gameResult) gameResult = calculateScore(stoneMap);
  var record = {
    winner:      gameResult.winner,
    diff:        gameResult.diff,
    blackTerr:   gameResult.blackTerritory || 0,
    whiteTerr:   gameResult.whiteTerritory || 0,
    blackStones: gameResult.blackStones || 0,
    whiteStones: gameResult.whiteStones || 0,
    totalMoves:  moves.length,
    resign:      gameResult.resign || false,
    createdAt:   Date.now()
  };
  history_saveRecord(record);
  if (network_isOnline()) network_endGame();
  storageRemove('hc_game');
  saveGame();
}

function endGameCleanup() {
  if (network_isOnline()) network_endGame();
  network_reset();
  isOnline = false; myTurn = true;
  gameResult = null; koPoint = null; countingRequested = false;
  pendingMove = null;
  var mvModal = document.getElementById('moveModal');
  if (mvModal) mvModal.classList.remove('show');
  gameChatMessages = [];
  stoneMap.clear(); moves = []; currentIdx = -1; currentColor = 'B';
  // 隐藏聊天栏（除非在论坛模式）
  if (STATE !== 'FORUM') {
    var chatBar = document.getElementById('chatBar');
    if (chatBar) chatBar.classList.remove('show');
  }
}

function doUndo() {
  if (isOnline) { showToast('联网对局不支持悔棋', 1500); return; }
  var r = undoMove(stoneMap, moves, currentIdx);
  if (r.success) { currentIdx = r.newIdx; currentColor = moves.length % 2 === 0 ? 'B' : 'W'; saveGame(); }
}

function doClear() {
  if (isOnline) { showToast('联网对局不支持清空棋盘', 1500); return; }
  if (!moves.length) return;
  showModal('清空棋盘', '确定清空当前对局吗？', function() {
    stoneMap.clear(); moves = []; currentIdx = -1; currentColor = 'B';
    var uid = auth_getUserId(); var key = uid ? 'hc_game_' + uid : 'hc_game'; storageRemove(key);
  });
}

function saveGame() {
  if (isOnline) return;
  var uid = auth_getUserId();
  var key = uid ? 'hc_game_' + uid : 'hc_game';
  storageSet(key, JSON.stringify({ moves: moves.map(function(m){return {x:m.x,y:m.y,color:m.color};}), currentIdx: currentIdx }));
}

function restoreGame() {
  try {
    var uid = auth_getUserId();
    var key = uid ? 'hc_game_' + uid : 'hc_game';
    var raw = storageGet(key); if (!raw) return false;
    var d = JSON.parse(raw); if (d.moves && d.moves.length) { moves = d.moves; currentIdx = d.currentIdx != null ? d.currentIdx : moves.length - 1; rebuildStones(stoneMap, moves, currentIdx); currentColor = moves.length % 2 === 0 ? 'B' : 'W'; return true; }
  } catch(e) {}
  return false;
}

init();
</script>
